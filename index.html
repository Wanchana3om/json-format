<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>JSON Format</title>
    <link rel="stylesheet" href="styles.css">
    <script src="lucide.min.js" defer></script>
    <script src="acorn.js" defer></script>
    <script src="diff.js" defer></script>
    <script src="formatter.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body data-mode="json">
    <div class="app">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span class="brand-json">{ }</span><i data-lucide="binary" class="brand-binary" aria-hidden="true"></i><i data-lucide="columns-2" class="brand-compare" aria-hidden="true"></i></div>
          <div>
            <h1><span id="brand-title">JSON Format</span><span class="brand-dot">.</span></h1>
            <span class="brand-caption">JSON / LOG WORKSPACE</span>
          </div>
        </div>
        <div class="mode-switch" role="group" aria-label="โหมดเครื่องมือ">
          <label class="mode-choice">
            <input id="json-mode" type="radio" name="tool-mode" value="json" checked>
            <span class="mode-option"><i data-lucide="braces" aria-hidden="true"></i><span class="mode-label-long">JSON Format</span><span class="mode-label-short">JSON</span></span>
          </label>
          <label class="mode-choice">
            <input id="base64-mode" type="radio" name="tool-mode" value="base64">
            <span class="mode-option"><i data-lucide="binary" aria-hidden="true"></i>Base64</span>
          </label>
          <label class="mode-choice">
            <input id="compare-mode" type="radio" name="tool-mode" value="compare">
            <span class="mode-option"><i data-lucide="columns-2" aria-hidden="true"></i>Compare</span>
          </label>
        </div>
        <span class="local-badge" title="ข้อมูลอยู่ในเบราว์เซอร์ ไม่ส่งไปยังเซิร์ฟเวอร์">
          <i data-lucide="shield-check" aria-hidden="true"></i>
          LOCAL ONLY
        </span>
      </header>

      <main>
        <form id="formatter-form" novalidate>
          <div id="workspace-toolbar" class="workspace-toolbar">
            <h2>พื้นที่ทำงาน <span class="workspace-tag">JSON / LOG / MONGO</span></h2>
            <div id="json-controls" class="format-controls">
              <label class="scope-control" for="format-scope">รูปแบบ
                <select id="format-scope" name="format-scope">
                  <option value="whole">ทั้งข้อความ</option>
                  <option value="data">เฉพาะข้อมูล</option>
                </select>
              </label>
              <label class="validation-control"><input id="validate-json" type="checkbox">ตรวจโครงสร้าง</label>
              <label class="indent-control" for="indent">ระยะเยื้อง
                <select id="indent" name="indent">
                  <option value="2">2 spaces</option>
                  <option value="4">4 spaces</option>
                </select>
              </label>
              <button id="minify-button" class="icon-button" type="button" aria-label="ย่อ JSON" title="ย่อ JSON / Remove white space">
                <i data-lucide="minimize-2" aria-hidden="true"></i>
              </button>
              <button class="primary-button" type="submit" title="จัดรูปแบบ (Ctrl + Enter)">
                <i data-lucide="list-tree" aria-hidden="true"></i>
                จัดรูปแบบ
              </button>
            </div>
            <div id="base64-controls" class="format-controls base64-controls" hidden>
              <button id="encode-base64-button" class="secondary-button" type="button" title="Encode ข้อความ UTF-8 เป็น Base64 (Ctrl + Enter)">
                <i data-lucide="binary" aria-hidden="true"></i>Encode
              </button>
              <button id="decode-base64-button" class="primary-button" type="button" title="Decode Base64 เป็นข้อความ UTF-8">
                <i data-lucide="text" aria-hidden="true"></i>Decode
              </button>
            </div>
            <div id="compare-controls" class="format-controls" hidden>
              <button id="compare-example" class="quiet-button" type="button" title="โหลดตัวอย่างเปรียบเทียบ"><i data-lucide="file-code-2" aria-hidden="true"></i><span>ตัวอย่าง</span></button>
              <label class="validation-control"><input id="compare-json" type="checkbox">จัดรูปแบบ JSON ก่อนเทียบ</label>
              <button id="compare-swap" class="icon-button" type="button" aria-label="สลับข้อความสองฝั่ง" title="สลับข้อความสองฝั่ง"><i data-lucide="arrow-left-right" aria-hidden="true"></i></button>
              <button id="compare-clear" class="icon-button" type="button" aria-label="ล้างข้อความเปรียบเทียบทั้งสองฝั่ง" title="ล้างข้อความทั้งสองฝั่ง"><i data-lucide="trash-2" aria-hidden="true"></i></button>
              <button id="compare-button" class="primary-button" type="button" title="เปรียบเทียบ (Ctrl + Enter)"><i data-lucide="git-compare-arrows" aria-hidden="true"></i>เปรียบเทียบ</button>
            </div>
          </div>

          <div id="single-workspace" class="editors">
            <section class="editor-pane input-pane" aria-labelledby="input-heading">
              <div class="pane-toolbar">
                <div class="pane-heading">
                  <button id="toolbar-toggle" class="icon-button toolbar-toggle" type="button" aria-label="ซ่อนแถบเครื่องมือ" title="ซ่อนแถบเครื่องมือ" aria-controls="workspace-toolbar" aria-expanded="true">
                    <i data-lucide="panel-top-close" class="collapse-toolbar-icon" aria-hidden="true"></i>
                    <i data-lucide="panel-top-open" class="expand-toolbar-icon" aria-hidden="true"></i>
                  </button>
                  <h3 id="input-heading"><label for="source">ข้อความ</label></h3>
                </div>
                <div class="pane-actions">
                  <button id="example-button" class="quiet-button" type="button" title="โหลดข้อมูลตัวอย่าง">
                    <i data-lucide="file-code-2" aria-hidden="true"></i><span>ตัวอย่าง</span>
                  </button>
                  <button id="paste-button" class="icon-button" type="button" aria-label="วางจากคลิปบอร์ด" title="วางจากคลิปบอร์ด">
                    <i data-lucide="clipboard-paste" aria-hidden="true"></i>
                  </button>
                  <button id="import-button" class="icon-button" type="button" aria-label="เปิดไฟล์ JSON, log หรือ MongoDB" title="เปิดไฟล์ JSON, log หรือ MongoDB">
                    <i data-lucide="folder-open" aria-hidden="true"></i>
                  </button>
                  <input id="file-input" type="file" accept=".json,.json5,.log,.txt,.bson,.js,application/json,text/plain" hidden>
                  <span class="action-divider" aria-hidden="true"></span>
                  <button id="wrap-button" class="icon-button" type="button" aria-label="ตัดบรรทัด" aria-pressed="true" title="ตัดบรรทัด">
                    <i data-lucide="wrap-text" aria-hidden="true"></i>
                  </button>
                  <button id="clear-button" class="icon-button" type="button" aria-label="ล้างข้อมูล" title="ล้างข้อมูล">
                    <i data-lucide="trash-2" aria-hidden="true"></i>
                  </button>
                  <button id="copy-button" class="icon-button" type="button" aria-label="คัดลอกผลลัพธ์" title="คัดลอกผลลัพธ์" disabled>
                    <i data-lucide="copy" aria-hidden="true"></i>
                  </button>
                  <button id="download-button" class="icon-button" type="button" aria-label="ดาวน์โหลดผลลัพธ์" title="ดาวน์โหลดผลลัพธ์" disabled>
                    <i data-lucide="download" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
              <div class="editor-body output-body">
                <div id="view-navigation" class="output-navigation" role="tablist" aria-label="มุมมองข้อความ">
                  <button id="text-tab" class="view-tab" type="button" role="tab" aria-selected="true" aria-controls="text-panel">Text</button>
                  <button id="viewer-tab" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="viewer-panel" tabindex="-1">Viewer</button>
                </div>
                <div class="output-content">
                  <div id="text-panel" role="tabpanel" aria-labelledby="text-tab">
                    <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-describedby="status" placeholder="{&#10;  &quot;message&quot;: &quot;Hello, JSON&quot;,&#10;  &quot;ready&quot;: true&#10;}" wrap="soft"></textarea>
                  </div>
                  <div id="viewer-panel" role="tabpanel" aria-labelledby="viewer-tab" hidden>
                    <div class="tree-toolbar">
                      <input id="tree-search" type="search" aria-label="ค้นหา key หรือค่า" placeholder="ค้นหา key หรือค่า" autocomplete="off">
                      <span id="search-count" aria-live="polite"></span>
                      <button id="expand-button" class="icon-button" type="button" aria-label="ขยายทั้งหมด" title="ขยายทั้งหมด"><i data-lucide="list-plus" aria-hidden="true"></i></button>
                      <button id="collapse-button" class="icon-button" type="button" aria-label="ยุบทั้งหมด" title="ยุบทั้งหมด"><i data-lucide="list-minus" aria-hidden="true"></i></button>
                    </div>
                    <div id="json-tree" class="json-tree" tabindex="0" aria-label="JSON tree"></div>
                  </div>
                </div>
              </div>
              <div class="pane-footer"><span id="source-count">0 ตัวอักษร</span><span id="block-count" class="block-count" hidden></span><span id="output-count">0 บรรทัด</span></div>
            </section>
          </div>

          <div id="compare-workspace" hidden>
            <div id="compare-inputs" class="editors compare-inputs">
              <section class="editor-pane" aria-labelledby="compare-left-heading">
                <div class="pane-toolbar">
                  <div class="pane-heading">
                    <button id="compare-toolbar-toggle" class="icon-button toolbar-toggle" type="button" aria-label="ซ่อนแถบเครื่องมือ" title="ซ่อนแถบเครื่องมือ" aria-controls="workspace-toolbar" aria-expanded="true">
                      <i data-lucide="panel-top-close" class="collapse-toolbar-icon" aria-hidden="true"></i><i data-lucide="panel-top-open" class="expand-toolbar-icon" aria-hidden="true"></i>
                    </button>
                    <h3 id="compare-left-heading"><label for="compare-left">ต้นฉบับ</label></h3>
                  </div>
                  <div class="pane-actions">
                    <button id="compare-left-format" class="icon-button" type="button" aria-label="จัดรูปแบบต้นฉบับ" title="จัดรูปแบบต้นฉบับ"><i data-lucide="list-tree" aria-hidden="true"></i></button>
                    <button id="compare-left-paste" class="icon-button" type="button" aria-label="วางต้นฉบับจากคลิปบอร์ด" title="วางจากคลิปบอร์ด"><i data-lucide="clipboard-paste" aria-hidden="true"></i></button>
                    <button id="compare-left-import" class="icon-button" type="button" aria-label="เปิดไฟล์ต้นฉบับ" title="เปิดไฟล์ต้นฉบับ"><i data-lucide="folder-open" aria-hidden="true"></i></button>
                    <input id="compare-left-file" type="file" accept=".json,.json5,.txt,.log,.js,text/plain,application/json" hidden>
                    <button id="compare-left-clear" class="icon-button" type="button" aria-label="ล้างต้นฉบับ" title="ล้างต้นฉบับ"><i data-lucide="trash-2" aria-hidden="true"></i></button>
                  </div>
                </div>
                <div class="editor-body"><textarea id="compare-left" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="ต้นฉบับ" aria-describedby="status" wrap="soft"></textarea></div>
                <div class="pane-footer"><span id="compare-left-count">0 ตัวอักษร</span><span>ORIGINAL</span></div>
              </section>
              <section class="editor-pane" aria-labelledby="compare-right-heading">
                <div class="pane-toolbar">
                  <h3 id="compare-right-heading"><label for="compare-right">ข้อความใหม่</label></h3>
                  <div class="pane-actions">
                    <button id="compare-right-format" class="icon-button" type="button" aria-label="จัดรูปแบบข้อความใหม่" title="จัดรูปแบบข้อความใหม่"><i data-lucide="list-tree" aria-hidden="true"></i></button>
                    <button id="compare-right-paste" class="icon-button" type="button" aria-label="วางข้อความใหม่จากคลิปบอร์ด" title="วางจากคลิปบอร์ด"><i data-lucide="clipboard-paste" aria-hidden="true"></i></button>
                    <button id="compare-right-import" class="icon-button" type="button" aria-label="เปิดไฟล์ข้อความใหม่" title="เปิดไฟล์ข้อความใหม่"><i data-lucide="folder-open" aria-hidden="true"></i></button>
                    <input id="compare-right-file" type="file" accept=".json,.json5,.txt,.log,.js,text/plain,application/json" hidden>
                    <button id="compare-right-clear" class="icon-button" type="button" aria-label="ล้างข้อความใหม่" title="ล้างข้อความใหม่"><i data-lucide="trash-2" aria-hidden="true"></i></button>
                  </div>
                </div>
                <div class="editor-body"><textarea id="compare-right" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="ข้อความใหม่" aria-describedby="status" wrap="soft"></textarea></div>
                <div class="pane-footer"><span id="compare-right-count">0 ตัวอักษร</span><span>MODIFIED</span></div>
              </section>
            </div>
            <section id="compare-result" class="compare-result" aria-label="ผลการเปรียบเทียบ" hidden>
              <div class="pane-toolbar">
                <div id="compare-summary" class="compare-summary" aria-live="polite"></div>
                <div class="pane-actions">
                  <button id="compare-inputs-toggle" class="icon-button compare-inputs-toggle" type="button" aria-label="ซ่อนช่องข้อความ" title="ซ่อนช่องข้อความ" aria-controls="compare-inputs" aria-expanded="true">
                    <i data-lucide="panel-top-close" class="collapse-inputs-icon" aria-hidden="true"></i><i data-lucide="panel-top-open" class="expand-inputs-icon" aria-hidden="true"></i>
                  </button>
                  <span id="compare-position" class="compare-position" aria-live="polite"></span>
                  <button id="compare-previous" class="icon-button" type="button" aria-label="จุดต่างก่อนหน้า" title="จุดต่างก่อนหน้า" disabled><i data-lucide="chevron-up" aria-hidden="true"></i></button>
                  <button id="compare-next" class="icon-button" type="button" aria-label="จุดต่างถัดไป" title="จุดต่างถัดไป" disabled><i data-lucide="chevron-down" aria-hidden="true"></i></button>
                </div>
              </div>
              <div class="diff-headings"><span>ต้นฉบับ</span><span>ข้อความใหม่</span></div>
              <div id="compare-diff" class="compare-diff" tabindex="0" aria-label="บรรทัดที่เหมือนและแตกต่าง"></div>
            </section>
          </div>

          <div class="status-bar">
            <p id="status" role="status" aria-live="polite" aria-atomic="true"><span class="status-dot" aria-hidden="true"></span><span id="status-text">พร้อม</span></p>
            <span class="encoding">UTF-8</span>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
